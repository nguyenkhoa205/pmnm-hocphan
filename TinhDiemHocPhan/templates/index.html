<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 50%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 800;
            background: linear-gradient(90deg, #0284c7, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #374151;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: all 0.25s ease;
            background-color: #f9fafb;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
        }

        .result-box {
            margin-top: 25px;
            padding: 16px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            text-align: center;
        }

        .result-title {
            font-size: 0.8rem;
            color: #1e40af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .result-value {
            font-size: 1.35rem;
            color: #1e3a8a;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tính Điểm Học Phần</h1>

        <form method="POST" action="{{ url_for('grade') }}">
            <div class="form-group">
                <label for="cc">Chuyên cần (10%):</label>
                <input type="text" id="cc" name="cc" value="{{ cc }}" 
                       class="{% if errors.cc %}input-error{% endif %}" 
                       placeholder="Nhập điểm chuyên cần...">
                {% if errors.cc %}
                    <div class="error">{{ errors.cc }}</div>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="gk">Giữa kỳ (30%):</label>
                <input type="text" id="gk" name="gk" value="{{ gk }}" 
                       class="{% if errors.gk %}input-error{% endif %}" 
                       placeholder="Nhập điểm giữa kỳ...">
                {% if errors.gk %}
                    <div class="error">{{ errors.gk }}</div>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="ck">Cuối kỳ (60%):</label>
                <input type="text" id="ck" name="ck" value="{{ ck }}" 
                       class="{% if errors.ck %}input-error{% endif %}" 
                       placeholder="Nhập điểm cuối kỳ...">
                {% if errors.ck %}
                    <div class="error">{{ errors.ck }}</div>
                {% endif %}
            </div>

            <button type="submit">Tính Điểm</button>
        </form>

        {% if result %}
            <div class="result-box">
                <div class="result-title">Kết quả học phần</div>
                <div class="result-value">{{ result }}</div>
            </div>
        {% endif %}
    </div>
</body>
</html>
