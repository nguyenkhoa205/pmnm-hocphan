<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - {{ shop.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        nav { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 15px; text-decoration: none; font-weight: bold; color: #0066cc; }
        footer { margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc; font-size: 0.9em; color: #666; }

        /* CSS cho thẻ món */
        .menu-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .item-card { border: 1px solid #ccc; padding: 15px; border-radius: 6px; width: 180px; background-color: #f9f9f9; }
        .item-card.het-hang { border-color: #e53935; background-color: #ffebee; }
        .het-hang-text { color: #d32f2f; font-weight: bold; }

        /* CSS cho phân trang */
        .pagination { margin-top: 20px; }
        .pagination a, .pagination strong { display: inline-block; padding: 6px 12px; margin-right: 4px; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; }
        .pagination strong { background-color: #0066cc; color: white; border-color: #0066cc; }
    </style>
    {% block style %}{% endblock %}
</head>
<body>
    {% include '_navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include '_footer.html' %}
</body>
</html>
