<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <!-- Phông chữ Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            /* Nền Gradient mượt dạng không gian sẫm */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Card kính mờ Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #64748b;
            font-size: 0.875rem;
            margin-top: 6px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #334155;
            font-size: 0.875rem;
        }

        /* Khung nhập liệu có chứa đơn vị bên trong */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            padding-right: 50px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
            color: #0f172a;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .unit {
            position: absolute;
            right: 16px;
            font-weight: 700;
            color: #94a3b8;
            font-size: 0.875rem;
            pointer-events: none;
        }

        /* Đổi màu ô khi gặp lỗi */
        .input-error {
            border-color: #f43f5e !important;
            background-color: #fff1f2 !important;
        }

        .input-error:focus {
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15) !important;
        }

        .error {
            color: #e11d48;
            font-size: 0.825rem;
            margin-top: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }

        button:active {
            transform: translateY(0);
        }

        /* Khung hiển thị kết quả theo phân màu */
        .result-box {
            margin-top: 28px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box.green {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1.5px solid #34d399;
            color: #065f46;
        }

        .result-box.yellow {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1.5px solid #fbbf24;
            color: #92400e;
        }

        .result-box.red {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            border: 1.5px solid #f87171;
            color: #9f1239;
        }

        .result-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 800;
            opacity: 0.75;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .ideal-weight {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.9;
            padding-top: 8px;
            border-top: 1px dashed rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Tính Chỉ Số BMI</h1>
                <p>Kiểm tra thể trạng sức khỏe theo chuẩn Châu Á</p>
            </div>

            <form method="POST" action="{{ url_for('calculate_bmi') }}">
                <!-- Chiều cao -->
                <div class="form-group">
                    <label for="height">Chiều cao</label>
                    <div class="input-wrapper">
                        <input type="text" id="height" name="height" value="{{ height }}" 
                               class="{% if errors.height %}input-error{% endif %}" 
                               placeholder="170">
                        <span class="unit">cm</span>
                    </div>
                    {% if errors.height %}
                        <div class="error">⚠️ {{ errors.height }}</div>
                    {% endif %}
                </div>

                <!-- Cân nặng -->
                <div class="form-group">
                    <label for="weight">Cân nặng</label>
                    <div class="input-wrapper">
                        <input type="text" id="weight" name="weight" value="{{ weight }}" 
                               class="{% if errors.weight %}input-error{% endif %}" 
                               placeholder="65">
                        <span class="unit">kg</span>
                    </div>
                    {% if errors.weight %}
                        <div class="error">⚠️ {{ errors.weight }}</div>
                    {% endif %}
                </div>

                <button type="submit">Tính toán ngay</button>
            </form>

            <!-- Khung kết quả -->
            {% if result %}
                <div class="result-box {{ result.color }}">
                    <div class="result-title">Kết quả BMI</div>
                    <div class="result-value">
                        {{ result.bmi }} - {{ result.category }}
                    </div>
                    <div class="ideal-weight">
                        nên có {{ result.ideal_weight }}
                    </div>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
