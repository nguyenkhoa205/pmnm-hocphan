<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 800;
            background: linear-gradient(90deg, #0284c7, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #374151;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: all 0.25s ease;
            background-color: #f9fafb;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
        }

        /* Định dạng khung kết quả theo màu phân loại */
        .result-box {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid;
        }

        .result-box.green {
            background-color: #ecfdf5;
            border-color: #10b981;
            color: #065f46;
        }

        .result-box.yellow {
            background-color: #fffbeb;
            border-color: #f59e0b;
            color: #92400e;
        }

        .result-box.red {
            background-color: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .result-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .ideal-weight {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tính Chỉ Số BMI</h1>

        <form method="POST" action="{{ url_for('calculate_bmi') }}">
            <!-- Ô nhập chiều cao -->
            <div class="form-group">
                <label for="height">Chiều cao (cm):</label>
                <input type="text" id="height" name="height" value="{{ height }}" 
                       class="{% if errors.height %}input-error{% endif %}" 
                       placeholder="Ví dụ: 170">
                {% if errors.height %}
                    <div class="error">{{ errors.height }}</div>
                {% endif %}
            </div>

            <!-- Ô nhập cân nặng -->
            <div class="form-group">
                <label for="weight">Cân nặng (kg):</label>
                <input type="text" id="weight" name="weight" value="{{ weight }}" 
                       class="{% if errors.weight %}input-error{% endif %}" 
                       placeholder="Ví dụ: 65 hoặc 65,5">
                {% if errors.weight %}
                    <div class="error">{{ errors.weight }}</div>
                {% endif %}
            </div>

            <button type="submit">Tính BMI</button>
        </form>

        <!-- Khung hiển thị kết quả -->
        {% if result %}
            <div class="result-box {{ result.color }}">
                <div class="result-title">Kết quả BMI</div>
                <div class="result-value">
                    {{ result.bmi }} - {{ result.category }}
                </div>
                <div class="ideal-weight">
                    Cân nặng nên có: {{ result.ideal_weight }}
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
